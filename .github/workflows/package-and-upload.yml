name: Package SwanLab Images & Upload to Hugging Face

on:
  workflow_dispatch:
    inputs:
      swanlab_version:
        description: 'SwanLab version tag (e.g. v3.6.4)'
        required: false
        default: 'v3.6.4'
      hf_repo_id:
        description: 'Hugging Face dataset repo (e.g. TPAMI/swanlab-offline-images)'
        required: true
        default: 'TPAMI/swanlab-offline-images'
      hf_private:
        description: 'Make the Hugging Face dataset private? (only used when creating new)'
        type: boolean
        required: true
        default: false

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show Disk Space
        run: df -h

      - name: Pull and Retag Images (Docker Hub preferred)
        run: |
          set -euo pipefail
          VERSION="${{ inputs.swanlab_version }}"

          pull_with_retry() {
            local img="$1"
            local attempts=3
            for i in $(seq 1 $attempts); do
              echo "[Attempt $i/$attempts] Pulling $img"
              if docker pull "$img"; then
                return 0
              fi
              echo "Failed, sleeping before retry..."
              sleep $((i * 10))
            done
            echo "ERROR: Failed to pull $img after $attempts attempts"
            return 1
          }

          pull_first_available() {
            local dest_tag="$1"
            shift
            for src in "$@"; do
              if pull_with_retry "$src"; then
                docker tag "$src" "$dest_tag"
                echo "Tagged $src -> $dest_tag"
                return 0
              fi
            done
            echo "WARNING: Could not pull any source for $dest_tag"
            return 1
          }

          pull_with_retry "traefik:v3.1"
          docker tag traefik:v3.1 repo.swanlab.cn/self-hosted/traefik:v3.1

          pull_with_retry "postgres:16.1"
          docker tag postgres:16.1 repo.swanlab.cn/self-hosted/postgres:16.1

          pull_first_available "repo.swanlab.cn/self-hosted/redis-stack:7.2.0-v15" \
            "redis/redis-stack-server:7.2.0-v15" \
            "redis/redis-stack-server:7.2.0-v14" || true

          pull_with_retry "clickhouse/clickhouse-server:24.3"
          docker tag clickhouse/clickhouse-server:24.3 repo.swanlab.cn/self-hosted/clickhouse-server:24.3

          pull_with_retry "fluent/fluent-bit:3.1"
          docker tag fluent/fluent-bit:3.1 repo.swanlab.cn/self-hosted/fluent-bit:3.1

          pull_first_available "repo.swanlab.cn/self-hosted/minio/minio:RELEASE.2025-02-28T09-55-16Z" \
            "alpine/minio:RELEASE.2025-02-28T09-55-16Z" \
            "apecloud/minio:RELEASE.2025-02-28T09-55-16Z" \
            "minio/minio:RELEASE.2025-02-28T09-55-16Z" \
            "alpine/minio:RELEASE.2025-10-15T17-29-55Z" \
            "apecloud/minio:latest" || true

          pull_first_available "repo.swanlab.cn/self-hosted/minio/mc:RELEASE.2025-04-08T15-39-49Z" \
            "minio/mc:RELEASE.2025-04-08T15-39-49Z" \
            "minio/mc:latest" \
            "leanon/minio-mc:latest" || true

          pull_with_retry "alpine:3.19" || true
          docker tag alpine:3.19 repo.swanlab.cn/self-hosted/logrotate:1.0 || true

          pull_first_available "repo.swanlab.cn/self-hosted/swanlab-server:${VERSION}" \
            "swanlab/swanlab-server:${VERSION}" \
            "swanlab/swanlab-server:latest" || true

          pull_first_available "repo.swanlab.cn/self-hosted/swanlab-house:${VERSION}" \
            "swanlab/swanlab-house:${VERSION}" \
            "swanlab/swanlab-house:latest" || true

          pull_first_available "repo.swanlab.cn/self-hosted/swanlab-cloud:${VERSION}" \
            "swanlab/swanlab-next:${VERSION}" \
            "swanlab/swanlab-next:latest" || true

          pull_first_available "repo.swanlab.cn/self-hosted/swanlab-auth:${VERSION}" \
            "swanlab/swanlab-auth:${VERSION}" || true

          echo "=== Images after retag ==="
          docker images | head -60

      - name: Package Images into tar.gz
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y pigz
          VERSION="${{ inputs.swanlab_version }}"
          TAR_FILE="swanlab_images-${VERSION}.tar.gz"

          IMAGES_TO_SAVE=(
            "repo.swanlab.cn/self-hosted/traefik:v3.1"
            "repo.swanlab.cn/self-hosted/postgres:16.1"
            "repo.swanlab.cn/self-hosted/redis-stack:7.2.0-v15"
            "repo.swanlab.cn/self-hosted/clickhouse-server:24.3"
            "repo.swanlab.cn/self-hosted/fluent-bit:3.1"
            "repo.swanlab.cn/self-hosted/minio/minio:RELEASE.2025-02-28T09-55-16Z"
            "repo.swanlab.cn/self-hosted/minio/mc:RELEASE.2025-04-08T15-39-49Z"
            "repo.swanlab.cn/self-hosted/swanlab-server:${VERSION}"
            "repo.swanlab.cn/self-hosted/swanlab-house:${VERSION}"
            "repo.swanlab.cn/self-hosted/swanlab-cloud:${VERSION}"
          )

          EXISTING=()
          for img in "${IMAGES_TO_SAVE[@]}"; do
            if docker image inspect "$img" >/dev/null 2>&1; then
              EXISTING+=("$img")
              echo "Will save: $img"
            else
              echo "WARNING: $img not found, skipping"
            fi
          done

          if [ ${#EXISTING[@]} -eq 0 ]; then
            echo "ERROR: No images to save"
            exit 1
          fi

          docker save "${EXISTING[@]}" | pigz -6 -p 4 > "$TAR_FILE"
          ls -lh "$TAR_FILE"
          sha256sum "$TAR_FILE" > "${TAR_FILE}.sha256"
          echo "TAR_FILE=$TAR_FILE" >> $GITHUB_ENV

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo_id }}
          HF_PRIV: ${{ inputs.hf_private }}
        run: |
          set -euo pipefail
          pip install -q --break-system-packages -U huggingface_hub
          python3 - << 'PYEOF'
          import os
          import sys
          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_REPO"].strip()
          is_private = os.environ.get("HF_PRIV", "false").lower() == "true"
          tar_file = os.environ["TAR_FILE"]

          api = HfApi(token=token)

          print(f"Target dataset: {repo_id}")

          try:
              exists = api.repo_exists(repo_id, repo_type="dataset")
          except Exception as e:
              print(f"Warning: could not check if repo exists: {e}")
              exists = False

          if not exists:
              print(f"Dataset {repo_id} does not exist, attempting to create...")
              try:
                  api.create_repo(repo_id=repo_id, repo_type="dataset", private=is_private, exist_ok=True)
                  print(f"Created dataset {repo_id}")
              except HfHubHTTPError as e:
                  print(f"ERROR: Failed to create dataset {repo_id}")
                  print(f"Details: {e}")
                  print("Please make sure:")
                  print("  1. The HF_TOKEN has write permission for this namespace")
                  print("  2. Or create the dataset manually first")
                  sys.exit(1)
          else:
              print(f"Dataset {repo_id} already exists, will upload to it")

          print(f"Uploading {tar_file} ...")
          api.upload_file(
              path_or_fileobj=tar_file,
              path_in_repo=tar_file,
              repo_id=repo_id,
              repo_type="dataset",
              commit_message=f"Upload {tar_file}"
          )
          api.upload_file(
              path_or_fileobj=f"{tar_file}.sha256",
              path_in_repo=f"{tar_file}.sha256",
              repo_id=repo_id,
              repo_type="dataset",
              commit_message=f"Upload SHA256 for {tar_file}"
          )
          print("Upload complete!")
          PYEOF
